name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Extract repository name for base path
        id: repo-info
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "BASE_URL=/${REPO_NAME}/" >> $GITHUB_ENV

      - name: Build static site with prerendering
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: npx vite build

      - name: Add .nojekyll and 404 fallback
        run: |
          touch .output/public/.nojekyll
          cp .output/public/index.html .output/public/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
